services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: velo
      POSTGRES_USER: velo
      POSTGRES_PASSWORD: velo
    volumes:
      - velo_db:/var/lib/postgresql/data

  api:
    build: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ../backend/uploads:/app/uploads

volumes:
  velo_db:
