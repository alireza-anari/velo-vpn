server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/velo;
    index index.html;

    client_max_body_size 9m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /metrics {
        deny all;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/login {
        limit_req zone=velo_admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/admin/ {
        limit_req zone=velo_admin burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/v1/auth/(request-otp|verify-otp)$ {
        limit_req zone=velo_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/ {
        limit_req zone=velo_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
