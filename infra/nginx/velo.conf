server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # Replace with your certificate paths (e.g. Certbot).
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 9m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /metrics {
        # Prometheus should scrape the API locally/private-side, not through the public vhost.
        deny all;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /admin/login {
        limit_req zone=velo_admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /v1/admin/ {
        limit_req zone=velo_admin burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/v1/auth/(request-otp|verify-otp)$ {
        limit_req zone=velo_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=velo_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
