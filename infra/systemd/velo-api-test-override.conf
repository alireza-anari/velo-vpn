# TEST VPS ONLY: exposes the API directly on TCP/8000 without Nginx/TLS.
# Install as /etc/systemd/system/velo-api.service.d/test-http.conf.
# Remove this override before production; production should keep 127.0.0.1 behind HTTPS/Nginx.
[Service]
ExecStart=
ExecStart=/opt/velo/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
