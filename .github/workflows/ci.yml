name: Velo CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Alembic migration smoke test
        run: |
          cd backend
          rm -f /tmp/velo_alembic_ci.db
          DATABASE_URL=sqlite:////tmp/velo_alembic_ci.db ENVIRONMENT=development alembic -c alembic.ini upgrade head
          DATABASE_URL=sqlite:////tmp/velo_alembic_ci.db ENVIRONMENT=development alembic -c alembic.ini current
      - name: Backend integration tests
        run: |
          cd backend
          PYTHONPATH=. pytest -q
      - name: Python compile check
        run: python -m compileall -q backend/app infra/node-agent/app.py
      - name: Shell syntax check
        run: bash -n infra/backup/*.sh infra/production/*.sh infra/wireguard/*.sh

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        working-directory: android
        run: gradle :app:lintDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk


  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Web typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web lint
        working-directory: web
        run: npm run lint

      - name: Web production build
        working-directory: web
        run: npm run build
